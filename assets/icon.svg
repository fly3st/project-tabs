<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3445"/>
      <stop offset="1" stop-color="#151a23"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 96x96 artwork inside 16px padding, per Chrome Web Store icon guidelines -->
  <rect x="16" y="16" width="96" height="96" rx="24" fill="url(#bg)"/>
  <rect x="16" y="16" width="96" height="96" rx="24" fill="url(#shine)"/>
  <rect x="16.5" y="16.5" width="95" height="95" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- three projects: colored group chip + its tabs -->
  <rect x="30" y="36" width="30" height="13" rx="6.5" fill="#4c8dff"/>
  <rect x="65" y="38.5" width="33" height="8" rx="4" fill="#ffffff" fill-opacity=".55"/>
  <rect x="30" y="57.5" width="22" height="13" rx="6.5" fill="#34c26b"/>
  <rect x="57" y="60" width="41" height="8" rx="4" fill="#ffffff" fill-opacity=".28"/>
  <rect x="30" y="79" width="17" height="13" rx="6.5" fill="#ff9a3c"/>
  <rect x="52" y="81.5" width="34" height="8" rx="4" fill="#ffffff" fill-opacity=".28"/>
</svg>
